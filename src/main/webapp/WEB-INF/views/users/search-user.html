<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Поиск пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:text="${title}">Поиск пользователя</h1>

    <form method="get" class="mb-4">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label">Имя пользователя</label>
                <input type="text" name="name" class="form-control"
                       placeholder="Введите имя"
                       th:value="${searchName}">
            </div>
            <div class="col-md-4">
                <label class="form-label">Возраст</label>
                <input type="number" name="age" class="form-control"
                       placeholder="Введите возраст"
                       th:value="${searchAge}">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-primary w-100">Найти</button>
            </div>
            <div class="col-md-2">
                <a href="/users/search" class="btn btn-secondary w-100">Сбросить</a>
            </div>
        </div>
    </form>

    <!-- Сообщение если ничего не найдено -->
    <div th:if="${notFound}" class="alert alert-warning">
        Пользователь с указанными параметрами не найден
        <span th:if="${searchName}">Имя: <strong th:text="${searchName}"></strong></span>
        <span th:if="${searchAge}">, Возраст: <strong th:text="${searchAge}"></strong></span>
    </div>

    <!-- Результаты поиска -->
    <div th:if="${searchResult != null}" class="card">
        <div class="card-header">
            Найден пользователь
        </div>
        <div class="card-body">
            <h5 class="card-title" th:text="${searchResult.name}">userName</h5>
            <p class="card-text">Возраст: <span th:text="${searchResult.age}">25</span></p>
            <a th:href="@{/users/details(name=${searchResult.name})}"
               class="btn btn-primary">Подробнее</a>
        </div>
    </div>

    <!-- Подсказка если параметры не указаны -->
    <div th:if="${searchName == null and searchAge == null}" class="alert alert-info">
        Введите имя и/или возраст для поиска пользователя
    </div>

    <div class="mt-3">
        <a href="/users/all" class="btn btn-link">Все пользователи</a>
        <a href="/" class="btn btn-link">На главную</a>
    </div>
</div>
</body>
</html>
