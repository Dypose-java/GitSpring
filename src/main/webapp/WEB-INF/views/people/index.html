<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
</head>
<body>
<div  class="Users" th:each="person : ${people}">
    <div th:tabindex="person"></div>
    <a th:href="@{/people/{id}(id=${person.id})}" th:text="${person.getName()}">Имя пользователя</a>
</div>
</body>
</html>
